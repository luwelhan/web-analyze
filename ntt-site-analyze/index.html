<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺中國家歌劇院基地分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a 1920×1080 presentation stage; text column left, white-model axonometric centre, analysis instruments right, grouped chapter rail below. */
  --bg:#EDEFEC; --ink:#1E2124; --ink2:#4D5358; --ink3:#868C91; --rule:rgba(30,33,36,.14); --rule2:rgba(30,33,36,.28);
  --panel:rgba(237,239,236,.0); --btn:rgba(255,255,255,.74); --btnOn:#1E2124; --btnOnInk:#F4F5F2; --chip:rgba(30,33,36,.06);
  --accent:#A8323E; --sun:#C98516; --sunSoft:#F1D9A6; --wind:#2C7C93; --windLo:#7FB0C2; --windHi:#11495A; --glare:#7B55B5; --glareLo:#A985D8;
  --green:#5B8A3C; --greenLo:#D3E2C1; --water:#4F8FB0; --civic:#B08A4E; --grand:#A8323E; --play:#2F6F8F; --black:#3B3F44;
  --sunTheo:#CF9A45; --sunReal:#6E4708; --glareHi:#4A2A85; --shadeB:#4A78B8; --shadeT:#5B8A3C; --shadeLo:#F1E3BF; --shadeMid:#7FA3D6; --shadeHi:#23446F;
  --windN:#1F7FAE; --windS:#C98516; --enBeam:#6E4708; --enDiff:#A86F10; --enRefl:#CF9A45;
  --vTree:#5B8A3C; --vFar:#4A78B8; --vPark:#C98516; --vBlock:#8E2A3C; --free:#5B8A3C; --paid:#868C91;
  --sans:"Barlow","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131516; --ink:#E8EAE9; --ink2:#B5BBBF; --ink3:#7F868B; --rule:rgba(232,234,233,.14); --rule2:rgba(232,234,233,.28);
    --btn:rgba(34,37,40,.78); --btnOn:#E8EAE9; --btnOnInk:#131516; --chip:rgba(232,234,233,.08);
    --accent:#E0606C; --sun:#F0B343; --sunSoft:#5A4826; --wind:#3E92AA; --windLo:#1F5566; --windHi:#8FD0E0; --glare:#8E6CCB; --glareLo:#5D3F96;
    --green:#86B25F; --greenLo:#2C3B22; --water:#6FAED0; --civic:#D2AE72; --grand:#C2414D; --play:#3C88AB; --black:#6A7076;
    --sunTheo:#7A5A1E; --sunReal:#E0AE52; --glareHi:#C3A6EF; --shadeB:#5A86C6; --shadeT:#6A9944; --shadeLo:#3A3420; --shadeMid:#355A8A; --shadeHi:#A9C6EE;
    --windN:#3A8DBE; --windS:#B8821F; --enBeam:#E0AE52; --enDiff:#B07D24; --enRefl:#7A5A1E;
    --vTree:#6A9944; --vFar:#5A86C6; --vPark:#B8821F; --vBlock:#C2414D; --free:#6A9944; --paid:#7F868B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131516; --ink:#E8EAE9; --ink2:#B5BBBF; --ink3:#7F868B; --rule:rgba(232,234,233,.14); --rule2:rgba(232,234,233,.28);
  --btn:rgba(34,37,40,.78); --btnOn:#E8EAE9; --btnOnInk:#131516; --chip:rgba(232,234,233,.08);
  --accent:#E0606C; --sun:#F0B343; --sunSoft:#5A4826; --wind:#3E92AA; --windLo:#1F5566; --windHi:#8FD0E0; --glare:#8E6CCB; --glareLo:#5D3F96;
  --green:#86B25F; --greenLo:#2C3B22; --water:#6FAED0; --civic:#D2AE72; --grand:#C2414D; --play:#3C88AB; --black:#6A7076;
  --sunTheo:#7A5A1E; --sunReal:#E0AE52; --glareHi:#C3A6EF; --shadeB:#5A86C6; --shadeT:#6A9944; --shadeLo:#3A3420; --shadeMid:#355A8A; --shadeHi:#A9C6EE;
  --windN:#3A8DBE; --windS:#B8821F; --enBeam:#E0AE52; --enDiff:#B07D24; --enRefl:#7A5A1E;
  --vTree:#6A9944; --vFar:#5A86C6; --vPark:#B8821F; --vBlock:#C2414D; --free:#6A9944; --paid:#7F868B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#vp{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:1920px;height:1080px;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
.scrimL{position:absolute;left:0;top:0;bottom:0;width:880px;pointer-events:none;z-index:4;background:linear-gradient(90deg,var(--bg) 0,var(--bg) 560px,color-mix(in srgb,var(--bg) 70%,transparent) 680px,transparent 870px);transition:opacity .8s}
.scrimR{position:absolute;right:0;top:0;bottom:0;width:640px;pointer-events:none;z-index:4;opacity:0;transition:opacity .8s;background:linear-gradient(270deg,var(--bg) 0,var(--bg) 440px,transparent 630px)}
body.side .scrimR{opacity:1}
.scrimB{position:absolute;left:0;right:0;bottom:0;height:170px;pointer-events:none;z-index:4;background:linear-gradient(0deg,var(--bg) 0,var(--bg) 90px,transparent 170px)}
#pins{position:absolute;inset:0;z-index:6;pointer-events:none}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:14px;line-height:1.25;white-space:nowrap;transition:opacity .5s;color:var(--ink)}
.pin b{display:block;font-weight:500;padding:3px 8px;background:var(--btn);border:1px solid var(--rule2);backdrop-filter:blur(6px)}
.pin small{display:block;font-size:12px;color:var(--ink2);padding:2px 0 0 1px}
.pin i{display:block;width:1px;height:var(--lh,26px);margin:0 auto;background:var(--ink)}
.pin i::after{content:"";position:absolute;left:50%;bottom:-3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink)}
.pin.key b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pin.acc b{background:var(--accent);border-color:var(--accent);color:#fff}
.pin.flat{transform:translate(-50%,-50%)}
.pin.flat i{display:none}
.pin.flat b{background:none;border:0;backdrop-filter:none;padding:0;font-weight:500;font-size:13px;color:var(--ink2);letter-spacing:.04em}
.pin.num b{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--ink);color:var(--bg);border:0;cursor:pointer;pointer-events:auto}
.pin.num.on b{background:var(--accent)}
.pin.ring b{background:var(--accent);color:#fff;border:0;font-size:13px}
.pin.dim{opacity:.0}

header#top{position:absolute;left:72px;right:56px;top:36px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:20}
#mark{display:flex;align-items:baseline;gap:16px;font-size:16px;letter-spacing:.02em}
#mark b{font-weight:600}
#mark span{color:var(--ink2);padding-left:16px;border-left:1px solid var(--rule2)}
#tools{display:flex;gap:8px}
.tb{height:40px;padding:0 16px;border:1px solid var(--rule2);background:var(--btn);font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.tb:hover{border-color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.tb svg{flex:none}

#panel{position:absolute;left:72px;top:128px;width:500px;bottom:136px;z-index:10}
.pg{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;display:flex;flex-direction:column}
.pg.on{opacity:1;visibility:visible;transition:opacity .8s ease .35s,visibility 0s}
.mk{display:flex;align-items:baseline;gap:14px;font-size:15px;color:var(--ink2);margin:0 0 20px;letter-spacing:.04em}
.mk .no{font-size:15px;font-weight:600;color:var(--c,var(--accent));font-variant-numeric:tabular-nums;letter-spacing:.06em;border-bottom:2px solid var(--c,var(--accent));padding-bottom:2px}
h1{font-size:84px;line-height:1.08;font-weight:300;margin:0 0 26px;letter-spacing:.01em;text-wrap:balance}
h2{font-size:58px;line-height:1.16;font-weight:300;margin:0 0 22px;letter-spacing:.01em;text-wrap:balance}
html[lang="en"] h2{font-size:50px;line-height:1.08}
html[lang="en"] h1{font-size:76px}
.lede{font-size:18.5px;line-height:1.78;color:var(--ink2);margin:0 0 24px;max-width:31em}
html[lang="en"] .lede{font-size:17.5px;line-height:1.62}
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 26px;padding:20px 0 4px;border-top:1px solid var(--rule2);margin:0 0 22px}
.figs.three{grid-template-columns:repeat(3,auto);justify-content:space-between}
.figs.three .fig .n{font-size:44px;white-space:nowrap}
.fig .n{font-weight:300;font-size:50px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums}
.fig .n small{font-size:17px;font-weight:400;margin-left:4px;color:var(--ink2);letter-spacing:0}
.fig .l{font-size:14px;color:var(--ink3);margin-top:9px;line-height:1.45}
.notes{display:flex;flex-direction:column;gap:12px;margin:0 0 18px}
.nt{position:relative;padding-left:22px;font-size:16.5px;line-height:1.66;color:var(--ink2)}
.nt::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;border:2px solid var(--c,var(--ink))}
.nt b{color:var(--ink);font-weight:600;margin-right:8px}
html[lang="en"] .nt{font-size:15.5px;line-height:1.55}
.src{margin-top:auto;font-size:12.5px;line-height:1.62;color:var(--ink3);max-width:38em}
.hint{font-size:14px;color:var(--ink3);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-size:13.5px;padding:5px 11px;border:1px solid var(--rule2);color:var(--ink2);border-radius:999px}
.stack{display:grid;gap:0;margin:0 0 20px;border-top:1px solid var(--rule)}
.stack > div{display:grid;grid-template-columns:70px 1fr;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule);font-size:16px}
.stack span{font-size:13px;color:var(--ink3)}
.stack i{display:inline-block;width:22px;height:0;border-top:3px solid;margin-right:10px;vertical-align:middle}
.stack i.dash{border-top-style:dashed}
.lgd{display:grid;gap:9px;margin:0 0 18px}
.lgd > div{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:15.5px;color:var(--ink2);line-height:1.5}
.lgd i{width:16px;height:16px;margin-top:3px;background:var(--c);border:1px solid color-mix(in srgb,var(--c) 70%,#000)}
.lgd b{color:var(--ink);font-weight:600;margin-right:8px}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.focus-grid button,.route-choices button,.sec-routes button{text-align:left;padding:11px 14px;border:1px solid var(--rule2);background:var(--btn);cursor:pointer;font-size:15.5px;line-height:1.35}
.focus-grid button small,.route-choices button small,.sec-routes button small{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px}
.focus-grid button[aria-pressed="true"],.route-choices button[aria-pressed="true"],.sec-routes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.focus-grid button[aria-pressed="true"] small,.route-choices button[aria-pressed="true"] small,.sec-routes button[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.route-choices{display:grid;gap:7px;margin:0 0 12px}
.route-choices button{display:grid;grid-template-columns:28px 1fr;align-items:center}
.route-choices button i{width:18px;height:0;border-top:4px solid var(--rc)}
.sec-routes{display:grid;gap:7px;margin:0 0 12px}
.sec-routes button span{font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
.tool-strip{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tool-strip button{height:36px;padding:0 13px;border:1px solid var(--rule2);background:var(--btn);font-size:14px;cursor:pointer}
.tool-strip button[aria-pressed="true"]{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.inote{font-size:14.5px;color:var(--ink2);min-height:2.6em;margin:0 0 10px;line-height:1.55}
.ihint{font-size:13.5px;color:var(--ink3);margin:0 0 8px}
.mx{display:grid;gap:7px;margin:0 0 14px}
.mxb{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;padding:10px 12px;border:1px solid var(--rule);cursor:pointer;background:var(--btn)}
.mxb em{grid-row:span 2;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600}
.mxb span{font-size:15px;font-weight:500}
.mxb p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.45}
.mxb.on{border-color:var(--accent)}
.mxb.on em{background:var(--accent)}
.tl{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:4px 0 5px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:baseline}
.tl li b{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.tl li span{font-size:15.5px;line-height:1.4;color:var(--ink2)}
.tl li span small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.tl li.on b{color:var(--accent)}
.tl li.on span{color:var(--ink)}

#side{position:absolute;left:1504px;top:128px;width:360px;bottom:136px;z-index:10}
.sd{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s linear .35s;display:flex;flex-direction:column}
.sd.on{opacity:1;visibility:visible;transition:opacity .8s ease .55s,visibility 0s}
.sd h3{font-size:15px;font-weight:600;margin:20px 0 10px;letter-spacing:.02em}
.seg{display:flex;border:1px solid var(--ink);margin:0 0 18px}
.seg button{flex:1;height:40px;border:0;background:transparent;font-size:15px;cursor:pointer;border-left:1px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0 0 12px}
.ro .n{font-size:38px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.ro .n small{font-size:14px;color:var(--ink2);margin-left:3px}
.ro .l{font-size:13px;color:var(--ink3);margin-top:6px}
.ctl{display:flex;align-items:center;gap:12px;margin:6px 0 6px}
.pbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none}
input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:28px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule2)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--ink));margin-top:-8px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--ink))}
.cue{font-size:12.5px;color:var(--ink3);display:block;margin:0 0 8px}
.day{font-size:13.5px;color:var(--ink2);margin:6px 0 4px;line-height:1.5}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:88px 1fr 64px;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2)}
html[lang="en"] .bar{grid-template-columns:96px 1fr 64px}
.bar .tr{height:8px;background:var(--rule);position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--ink));border-radius:0 3px 3px 0}
.bar .tr em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bar b{font-weight:500;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rampbar{height:8px;margin:12px 0 4px}
.rampl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.wnote{font-size:13.5px;color:var(--ink2);line-height:1.6}
.shint{font-size:12.5px;color:var(--ink3);margin-top:auto;line-height:1.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin:8px 0}
.legend i{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle;background:var(--c)}
svg text{font-family:var(--sans)}
.steps{display:flex;gap:6px;margin:12px 0 12px}
.steps i{flex:1;height:3px;background:var(--rule2)}
.steps i.on{background:var(--accent)}
.card{border-top:1px solid var(--rule2);padding-top:16px}
.card .yr{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums}
.card .tt{font-size:18px;font-weight:500;margin:8px 0 6px}
.card .cap{font-size:15px;line-height:1.7;color:var(--ink2);min-height:120px;margin:0 0 12px}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.steps-list{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
.steps-list li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.5;color:var(--ink2)}
.steps-list li b{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:1px}

#rail{position:absolute;left:72px;right:56px;bottom:26px;height:74px;display:flex;align-items:flex-end;gap:18px;z-index:20}
#chap{flex:1;display:grid;gap:14px;grid-template-columns:3fr 5fr 3fr 2.2fr 3fr 3fr}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp > span{font-size:12px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap}
.grp > div{display:flex;gap:2px}
#chap button{flex:1;position:relative;border:0;background:transparent;cursor:pointer;text-align:left;padding:12px 0 0;font-size:13.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0}
#chap button::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--rule2)}
#chap button i{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--ink)}
#chap button[aria-current="step"]{color:var(--ink);font-weight:500}
#chap button[aria-current="step"] i{width:var(--pr,100%);background:var(--accent)}
#chap button em{font-style:normal;font-variant-numeric:tabular-nums;margin-right:6px}
.arr{width:44px;height:44px;border:1px solid var(--rule2);background:var(--btn);font-size:20px;cursor:pointer;flex:none}
.arr:hover{border-color:var(--ink)}
#mapkey{position:absolute;right:56px;bottom:124px;z-index:12;display:flex;align-items:center;gap:20px;font-size:13px;color:var(--ink2);pointer-events:none}
#sbar{height:6px;border:1px solid var(--ink);border-top:0}
#compass{width:80px;height:80px}
body.side #mapkey{right:440px}
#resetView{position:absolute;right:56px;top:96px;z-index:21;height:34px;padding:0 12px;font-size:13px;border:1px solid var(--rule2);background:var(--btn);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#resetView.on{opacity:1;pointer-events:auto}
body.side #resetView{right:56px}
#dragHint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:12;font-size:13.5px;color:var(--ink2);background:var(--btn);border:1px solid var(--rule2);padding:7px 14px;opacity:0;transition:opacity .6s;pointer-events:none}
#dragHint.on{opacity:1}
#portrait{display:none}
@media (orientation:portrait) and (max-width:820px){
  #portrait{display:flex;position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;padding:32px;text-align:center;font-size:17px;line-height:1.7}
}
@media (prefers-reduced-motion: reduce){ .pg,.sd,.pin{transition:none !important} }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
