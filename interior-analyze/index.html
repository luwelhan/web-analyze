<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>室內空間分析｜撞色曲線客廳</title>
<meta name="description" content="從一張室內照片推測完整空間，做成可環視的 3D 室內分析簡報：原圖與推測、平立面、動線、視域、日照、通風、溫度、聲環境、色彩、材質與軟裝。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* 室內空間分析簡報網站 — layout: 3D/drawing viewport left (~70%), chapter panel right (~30%), grouped chapter rail below.
   Phone: full-screen viewport, swipeable chapter strip on top, pull-up sheet at the bottom. Palette and type follow ntt-site-analyze. */
:root{
  --bg:#EDEFEC; --bg2:#E4E7E3; --ink:#1E2124; --ink2:#4D5358; --ink3:#868C91; --rule:rgba(30,33,36,.14); --rule2:rgba(30,33,36,.28);
  --btn:rgba(255,255,255,.74); --btnOn:#1E2124; --btnOnInk:#F4F5F2; --chip:rgba(30,33,36,.06); --paper:#F7F7F4;
  --accent:#A8323E; --sun:#C98516; --sunSoft:#F1D9A6; --wind:#2C7C93; --windLo:#7FB0C2; --windHi:#11495A; --green:#5B8A3C;
  --inf:#3D63B8; --infSoft:#DCE5F6; --cool:#3E7CB1; --warm:#C8553D;
  --daily:#A8323E; --chore:#C98516; --guest:#2C7C93;
  --sans:"Barlow","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --pw:clamp(340px,30vw,470px); --topH:56px; --railH:70px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--pw);grid-template-rows:var(--topH) minmax(0,1fr) var(--railH)}
#app > *{min-width:0}

/* top bar */
#top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--rule);background:var(--bg);z-index:30}
#mark{display:flex;align-items:baseline;gap:14px;font-size:16px;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden}
#mark b{font-weight:600}
#mark span{color:var(--ink2);padding-left:14px;border-left:1px solid var(--rule2);overflow:hidden;text-overflow:ellipsis}
#tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb{height:36px;padding:0 13px;border:1px solid var(--rule2);background:var(--btn);font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tb:hover{border-color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.tb svg{flex:none}
#lang b{font-weight:600}
#lang span{color:var(--ink3)}

/* viewport */
#view{grid-row:2;grid-column:1;position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.pick{cursor:pointer}
#svgv{position:absolute;inset:0;width:100%;height:100%;display:none;background:var(--paper);z-index:4}
#svgv.on{display:block}
#svgv *{vector-effect:non-scaling-stroke}
#photoL,#photoO{position:absolute;display:none;object-fit:contain;pointer-events:none;z-index:3}
#photoL.on,#photoO.on{display:block}
#photoL{background:var(--bg2)}
#pins{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:13px;line-height:1.25;white-space:nowrap;color:var(--ink);transition:opacity .3s}
.pin b{display:block;font-weight:500;padding:3px 8px;background:var(--btn);border:1px solid var(--rule2);backdrop-filter:blur(6px)}
.pin small{display:block;font-size:11.5px;color:var(--ink2);padding:2px 0 0 1px}
.pin i{display:block;width:1px;height:var(--lh,22px);margin:0 auto;background:var(--ink)}
.pin.key b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pin.acc b{background:var(--accent);border-color:var(--accent);color:#fff}
.pin.inf b{border-color:var(--inf);color:var(--inf)}
.pin.flat{transform:translate(-50%,-50%)}
.pin.flat i{display:none}
.pin.flat b{background:none;border:0;backdrop-filter:none;padding:0;font-weight:500;font-size:12.5px;color:var(--ink2);letter-spacing:.04em}
.pin.num b{width:26px;height:26px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--ink);color:var(--bg);border:0}
.pin.hot b{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:3px 9px}
.hud{position:absolute;z-index:7;pointer-events:none;font-size:12.5px;color:var(--ink2)}
#compass{right:18px;top:16px;width:64px;height:64px}
#scalebar{left:18px;bottom:16px;display:flex;flex-direction:column;gap:4px}
#scalebar i{display:block;height:6px;border:1px solid var(--ink);border-top:0}
#legend{left:18px;top:16px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:10px 12px;border:1px solid var(--rule);max-width:250px}
#legend:empty{display:none}
#legend div{display:flex;align-items:center;gap:8px;line-height:1.3}
#legend i{flex:none;width:14px;height:14px;background:var(--c);border:1px solid color-mix(in srgb,var(--c) 70%,#000)}
#legend i.ln{height:0;border:0;border-top:3px solid var(--c);width:18px}
#legend i.hatch{background:repeating-linear-gradient(135deg,var(--inf) 0 2px,var(--infSoft) 2px 6px);border-color:var(--inf)}
#legend .ramp{width:150px;height:10px;border:1px solid var(--rule2);background:var(--ramp)}
#legend .rampL{display:flex;justify-content:space-between;width:150px;font-size:11px;color:var(--ink3)}
#badge{right:18px;bottom:16px;padding:5px 10px;border:1px solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--bg) 85%,transparent);font-size:12.5px;letter-spacing:.06em;display:none}
#badge.on{display:block}
#vtools{position:absolute;right:18px;top:92px;z-index:8;display:flex;flex-direction:column;gap:6px}
#vtools .tb{height:32px;padding:0 10px;font-size:13px}
#vtools:empty{display:none}
#arrowL,#arrowR{position:absolute;top:50%;z-index:8;width:40px;height:56px;margin-top:-28px;border:1px solid var(--rule2);background:var(--btn);display:grid;place-items:center;opacity:.0;transition:opacity .25s}
#view:hover #arrowL,#view:hover #arrowR{opacity:.9}
#arrowL{left:12px} #arrowR{right:12px}
#arrowL:disabled,#arrowR:disabled{display:none}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:8px 14px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.94}
#busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--rule2);padding:12px 16px;font-size:13.5px;display:none;min-width:200px}
#busy.on{display:block}
#busy i{display:block;height:3px;background:var(--rule);margin-top:8px}
#busy i b{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#pop{position:absolute;z-index:15;background:var(--bg);border:1px solid var(--ink);padding:10px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:220px}
#pop.on{display:block}
#pop h4{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
#pop h4 button{border:0;background:none;font-size:18px;line-height:1;padding:0 2px;color:var(--ink3)}
#pop .vars{display:flex;gap:8px}
#pop .vars button{border:1px solid var(--rule2);background:var(--paper);padding:4px;width:120px;text-align:left;font-size:12.5px}
#pop .vars button img{display:block;width:110px;height:84px;object-fit:cover;background:#fff;margin-bottom:4px}
#pop .vars button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* panel */
#panel{grid-row:2;grid-column:2;overflow:auto;border-left:1px solid var(--rule);background:var(--bg);padding:26px 26px 30px;scrollbar-width:thin;z-index:10}
#grab{display:none}
.mk{display:flex;align-items:baseline;gap:12px;font-size:13.5px;color:var(--ink2);margin:0 0 14px;letter-spacing:.04em}
.mk .no{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.06em;border-bottom:2px solid var(--accent);padding-bottom:2px}
h1{font-size:40px;line-height:1.12;font-weight:300;margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
h2{font-size:31px;line-height:1.2;font-weight:300;margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:20px 0 9px;letter-spacing:.02em}
.lede{font-size:15.5px;line-height:1.75;color:var(--ink2);margin:0 0 16px}
.lede b{color:var(--ink);font-weight:600}
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px;padding:14px 0 4px;border-top:1px solid var(--rule2);margin:0 0 16px}
.figs.three{grid-template-columns:repeat(3,1fr)}
.fig .n{font-weight:300;font-size:32px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.fig .n small{font-size:13.5px;font-weight:400;margin-left:3px;color:var(--ink2);letter-spacing:0}
.fig .l{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.45}
.notes{display:flex;flex-direction:column;gap:9px;margin:0 0 14px}
.nt{position:relative;padding-left:20px;font-size:14px;line-height:1.62;color:var(--ink2)}
.nt::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;border:2px solid var(--c,var(--ink))}
.nt b{color:var(--ink);font-weight:600;margin-right:6px}
.src{font-size:11.5px;line-height:1.6;color:var(--ink3);margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
.hint{font-size:12.5px;color:var(--ink3);margin:0 0 10px;line-height:1.5}
.seg{display:flex;border:1px solid var(--ink);margin:0 0 12px;flex-wrap:nowrap}
.seg button{flex:1;min-height:34px;border:0;background:transparent;font-size:13.5px;border-left:1px solid var(--ink);padding:4px 6px;line-height:1.2}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.opt{border:1px solid var(--rule2);background:var(--btn);padding:8px 10px;text-align:left;font-size:13.5px;line-height:1.3;min-height:36px}
.opt small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.opt i.sw{display:inline-block;width:12px;height:12px;border:1px solid rgba(0,0,0,.25);margin-right:7px;vertical-align:-1px;background:var(--c)}
.row{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13.5px;color:var(--ink2)}
.row label{min-width:68px}
.row output{min-width:54px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{flex:1;accent-color:var(--accent);height:24px}
.tog{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:0 0 9px;color:var(--ink2);cursor:pointer;user-select:none}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.lgd{display:grid;gap:7px;margin:0 0 14px}
.lgd > div{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;font-size:13.5px;color:var(--ink2);line-height:1.45}
.lgd i{width:14px;height:14px;margin-top:2px;background:var(--c);border:1px solid color-mix(in srgb,var(--c) 70%,#000)}
.lgd i.ln{height:0;border:0;border-top:3px solid var(--c);margin-top:9px}
.lgd b{color:var(--ink);font-weight:600;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:12.5px;padding:4px 10px;border:1px solid var(--rule2);color:var(--ink2);border-radius:999px;background:transparent}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 14px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:500;color:var(--ink3);font-size:12px;border-bottom:1px solid var(--rule2);padding:5px 4px}
table.t td{border-bottom:1px solid var(--rule);padding:6px 4px;color:var(--ink2)}
table.t td.r,table.t th.r{text-align:right}
table.t tr.inf td:first-child{color:var(--inf)}
.bars{display:grid;gap:6px;margin:0 0 14px}
.bars > div{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.bars span.b{height:12px;background:var(--rule)}
.bars span.b i{display:block;height:100%;background:var(--c,var(--ink))}
.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cards{display:grid;gap:8px;margin:0 0 14px}
.card{border:1px solid var(--rule2);background:var(--btn);padding:10px 12px;text-align:left;font-size:13.5px;line-height:1.5;display:grid;gap:3px}
.card .k{font-size:11.5px;color:var(--accent);letter-spacing:.06em;font-weight:600}
.card .f{color:var(--ink)}
.card .s{color:var(--ink2)}
.card .s::before{content:"→ ";color:var(--accent)}
.card:hover{border-color:var(--ink)}
.style-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.style-cards button{border:1px solid var(--rule2);background:var(--paper);padding:5px;text-align:left;font-size:13px}
.style-cards button img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg2);margin-bottom:5px}
.style-cards button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:0 0 7px;font-size:12.5px;color:var(--ink2)}
.slot div{display:flex;gap:5px;flex-wrap:wrap}
.slot button{width:30px;height:30px;border:1px solid rgba(0,0,0,.22);background:var(--c);padding:0;position:relative}
.slot button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.pal{display:flex;height:44px;margin:0 0 6px;border:1px solid var(--rule)}
.pal button{border:0;padding:0;background:var(--c);flex:var(--w) 1 0;min-width:10px;position:relative}
.pal button span{position:absolute;left:4px;bottom:3px;font-size:10.5px;color:var(--tc,#fff);letter-spacing:.02em;white-space:nowrap}
.pal button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.ratio{display:flex;height:10px;margin:0 0 4px}
.ratio i{display:block;background:var(--c);flex:var(--w) 1 0}
.ratioL{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin:0 0 14px}
.chart{width:100%;height:auto;display:block;margin:0 0 10px}
.index-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.index-grid button{border:1px solid var(--rule2);background:var(--btn);padding:7px 9px;text-align:left;font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.index-grid button em{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
.defaults{font-size:11.5px;color:var(--ink3);line-height:1.6;border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
.warn{color:var(--accent);font-weight:600}
.okc{color:var(--green);font-weight:600}

/* chapter rail */
#rail{grid-column:1/3;display:flex;align-items:stretch;gap:14px;padding:8px 22px 10px;border-top:1px solid var(--rule);background:var(--bg);z-index:30}
.grp{flex:var(--n) 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.grp > span{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp > div{display:flex;gap:2px;flex:1}
.grp button{flex:1;position:relative;border:0;background:transparent;text-align:left;padding:10px 0 0;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0;text-overflow:ellipsis}
.grp button::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--rule2)}
.grp button i{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--accent);transition:width .3s}
.grp button[aria-current="step"]{color:var(--ink);font-weight:500}
.grp button[aria-current="step"] i{width:100%}
.grp button em{font-style:normal;font-variant-numeric:tabular-nums;margin-right:5px}
.grp button:hover{color:var(--ink)}

/* index overlay */
#index{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 96%,transparent);display:none;padding:70px 6vw 40px;overflow:auto}
#index.on{display:block}
#index h2{margin:0 0 22px}
#index .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
#index .cols div > span{display:block;font-size:12px;color:var(--ink3);letter-spacing:.06em;margin:0 0 8px;border-bottom:1px solid var(--rule2);padding-bottom:6px}
#index .cols button{display:flex;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 0;font-size:15px;color:var(--ink2)}
#index .cols button em{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600;width:22px}
#index .cols button:hover{color:var(--ink)}
#indexClose{position:absolute;right:24px;top:18px}

/* phone */
@media (max-width:820px){
  :root{--topH:48px;--railH:0px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--topH) 40px minmax(0,1fr)}
  #mark{flex:1 1 auto}
  #tools{flex:none}
  #top{padding:0 12px;gap:8px}
  #mark span{display:none}
  #mark{font-size:14.5px}
  .tb{height:32px;padding:0 9px;font-size:13px}
  #idxBtn .lbl{display:none}
  #rail{grid-row:2;grid-column:1;padding:0 8px;gap:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-top:0;border-bottom:1px solid var(--rule);align-items:center;scroll-snap-type:x proximity}
  #rail::-webkit-scrollbar{display:none}
  .grp{flex:none;flex-direction:row;align-items:center;gap:0}
  .grp > span{display:none}
  .grp > div{gap:0}
  .grp button{flex:none;padding:0 10px;height:40px;font-size:13px;color:var(--ink3);scroll-snap-align:center}
  .grp button::before{display:none}
  .grp button i{top:auto;bottom:0}
  .grp + .grp{border-left:1px solid var(--rule2)}
  #view{grid-row:3;grid-column:1}
  #gl,#svgv{height:calc(100% - var(--peek,190px))}
  #panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(78vh,640px);border-left:0;border-top:1px solid var(--rule2);padding:0 18px 26px;transform:translateY(calc(100% - var(--peek,190px)));transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.08);z-index:25}
  #panel.open{transform:translateY(0)}
  #grab{display:block;position:sticky;top:0;margin:0 -18px 8px;padding:8px 0 6px;background:var(--bg);z-index:2;touch-action:none;cursor:grab}
  #grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--rule2);margin:0 auto}
  h1{font-size:28px} h2{font-size:23px;margin-bottom:10px}
  .lede{font-size:14.5px}
  .fig .n{font-size:26px}
  #arrowL,#arrowR{display:none}
  #compass{width:48px;height:48px;right:10px;top:10px}
  #legend{left:10px;top:10px;font-size:11.5px;padding:7px 9px;max-width:200px}

": "原圖視角", "c01.free": "自由環視", "c01.overlay": "原圖疊圖", "c01.hatch": "標示推測區", "c01.split": "左右對照", "c01.fFurn": "家具照片可見", "c01.fOpen": "門窗照片可見", "c01.fFit": "相機擬合平均誤差", "c01.fRooms": "推測出的空間", "c01.n1": "可見區", "c01.n1b": "左牆後段拱窗、白色曲面牆與展台、拱門、胡桃木展示櫃、抽象畫與溝紋矮櫃、曲線沙發、單椅、茶几、地毯、落地燈、橢圓木格柵天花。", "c01.n2": "推測區", "c01.n2b": "右牆主入口＋玄關鞋櫃與曲面屏風、背後的拱形影音牆、左牆第二扇與右牆對稱拱窗、右後角廚房門與廚房、餐廳與廚房的窗。", "c01.n3": "透視不一致", "c01.n3b": "照片中餐廳的透視跟客廳對不起來（AI 生成圖常見），3D 依建築邏輯擺正，疊圖以客廳為準。", "c01.nophoto": "公開版不放原圖（來源不明）；本機版可疊圖比對。", "c01.src": "相機：針孔模型、俯仰 0°（兩點透視）、垂直視角約 100°、主點偏移 47 px；推測規則 R-1～R-6 見 SDD §4.4。", "c02.title": "空間總覽（3.5D）", "c02.short": "總覽", "c02.h2": "一間挑高 5.2 m 的曲線客廳", "c02.lede": "從右前角的玄關進入，天花先壓到 2.8 m，轉過白色曲面屏風後放大成 5.2 m 挑高的客廳；穿過 4 m 高的拱門是天花 3.6 m 的餐廳，右後角的門通往廚房。軸測圖不變形，面向你的外牆會自動隱藏。", "c02.axo": "軸測", "c02.persp": "透視", "c02.cut": "剖切 1.4 m", "c02.full": "完整牆高", "c02.views": "預設視角", "c02.fTotal": "總面積（室內淨）", "c02.fLiving": "客廳（含玄關）", "c02.fDining": "餐廳", "c02.fKitchen": "廚房（推測）", "c02.hint": "拖曳旋轉、滾輪縮放、右鍵（或 Shift＋拖曳）平移；手機單指旋轉、雙指縮放。", "c03.title": "平立面與尺寸", "c03.short": "平立面", "c03.h2": "平面與四向立面", "c03.lede": "圖面由同一份案例資料（case.json）即時產生：黑色是照片看得到的牆，藍色斜線是推測。立面 A～D 從入口順時針命名，點平面上的 A～D 圓圈也能切換。", "c03.plan": "平面", "c03.dims": "尺寸標註", "c03.dTotal": "總尺寸", "c03.dOpen": "開口尺寸", "c03.dFurn": "家具尺寸", "c03.lWall": "照片看得到的牆與家具", "c03.lInf": "推測（照片看不到）", "c03.lSoffit": "虛線＝造型天花與木格柵", "c03.hint": "單位 cm；室內淨尺寸；坪 = m² × 0.3025。", "c04.title": "室內爆炸圖", "c04.short": "爆炸圖", "c04.h2": "由下而上拆開六層", "c04.lede": "依構造順序往上拆開：地坪 → 牆與門窗 → 固定櫃 → 活動家具 → 燈具 → 天花。拖動滑桿控制拆解程度，點一層只看那一層。", "c04.slider": "拆解程度", "c04.layers": "圖層", "c04.floor": "地坪", "c04.floorD": "拋光大理石、地毯", "c04.walls": "牆＋門窗", "c04.wallsD": "鈷藍灰泥牆、白色曲面牆、拱窗、拱門、藝術品", "c04.builtin": "固定櫃", "c04.builtinD": "胡桃木展示櫃、影音櫃、鞋櫃、廚具", "c04.loose": "活動家具", "c04.looseD": "曲線沙發、單椅、茶几、餐桌椅", "c04.lights": "燈具", "c04.lightsD": "嵌燈、落地燈、檯燈、吊燈", "c04.ceiling": "天花", "c04.ceilingD": "藍色灰泥天花、白色造型天花、橢圓木格柵、餐廳間接光", "c04.hint": "再點一次同一層可恢復全部。", "c05.title": "機能分區", "c05.short": "分區", "c05.h2": "一個大空間裡的四個區塊", "c05.lede": "客廳是單一大空間，所以改用「區塊」分區：玄關、會客區、影音區、窗邊閱讀角，加上餐廳與廚房。左邊平面著色，右邊泡泡圖：圓的大小對應面積，實線是門或拱門，虛線是開放相連。", "c05.s.privacy": "公私領域", "c05.s.wet": "乾濕分區", "c05.s.activity": "動靜分區", "c05.k.public": "公共", "c05.k.semi": "半公共", "c05.k.service": "服務", "c05.k.transit": "過渡", "c05.k.dry": "乾區", "c05.k.wet": "濕區", "c05.k.active": "動態", "c05.k.quiet": "靜態", "c05.n.privacy": "玄關是過渡帶，客廳全區公共、餐廳半公共、廚房是服務區；沒有私密空間，訪客一進門就看得到全部。", "c05.n.wet": "只有廚房是濕區，靠後牆集中給排水，與客廳之間有門，油煙與水氣不會進入會客區。", "c05.n.activity": "窗邊閱讀角是唯一靜區，卻緊鄰會客區與通往餐廳的動線；需要軟性隔音（地毯、窗簾）或家具轉向。", "c05.fZones": "客廳內區塊", "c05.fWet": "濕區（廚房）", "c05.fQuiet": "靜區面積", "c05.fDoors": "與客廳相連的門／拱", "c05.bubble": "泡泡圖", "c05.bubbleNote": "實線＝門或拱門　虛線＝開放相連　藍色虛框＝推測", "c05.via.door": "門", "c05.via.arch": "拱門", "c05.out": "戶外／入口", "c05.hint": "單一空間以「區塊」而非房間分區（SDD FR-05）。", "ui.simMissing": "分析模組尚未載入。", "c06.title": "動線分析", "c06.short": "動線", "c06.h2": "三條動線在哪裡交會", "c06.lede": "把平面切成 10 cm 網格，牆與家具是障礙物（人體半徑 25 cm），用 A* 找出最短路徑：<b>起居</b>（入口→沙發）、<b>家事</b>（入口→廚房）、<b>訪客</b>（入口→沙發→餐廳）。路線重疊處標為熱點；換家具後會重新計算。", "c06.daily": "起居", "c06.chore": "家事", "c06.guest": "訪客", "c06.hot": "熱點", "c06.nEntry": "入口", "c06.nSofa": "沙發", "c06.nKitchen": "廚房", "c06.nDining": "餐廳", "c06.fClear": "主要走道淨寬（R-3）", "c06.n1": "玄關出口", "c06.n1b": "三條動線都從屏風北端進入客廳，這裡是全室最擁擠的點；屏風再往南收 30 cm 可讓出口更從容。", "c06.n2": "家事動線", "c06.n2b": "提著東西去廚房要沿右牆走到右後角，與起居動線共用沙發右側的走道；若廚房門改到玄關旁，家事動線可縮短一半並避開會客區。", "c06.src": "A*：8 鄰格、八方向距離啟發；路徑以視線法簡化。", "c07.title": "視域分析", "c07.short": "視域", "c07.h2": "站在這裡，看得到多少", "c07.lede": "從觀察點放出 360 條視線，牆、關著的門與高於 150 cm 的家具會擋住視線，得到可視範圍（Isovist）。<b>拖曳紅點</b>或點預設位置，數值即時更新。隱私指數 = 1 − 可視面積 ÷ 全室面積。", "c07.p.entry": "玄關", "c07.p.sofa": "沙發", "c07.p.chair": "單椅", "c07.p.dining": "餐桌", "c07.fArea": "可視面積", "c07.fPriv": "隱私指數", "c07.fQuiet": "看得到閱讀角", "c07.lVis": "可視範圍", "c07.lQuiet": "窗邊閱讀角（靜區）", "c07.lObs": "觀察點", "c07.n1": "玄關", "c07.n1b": "曲面屏風擋住了直視，進門先看到藍牆與拱門而不是整個客廳——這是「欲揚先抑」的視線控制。", "c07.n2": "閱讀角", "c07.n2b": "沙發幾乎看得到整個閱讀角，坐在單椅上的人隱私偏低；若要當作安靜角落，可把單椅轉向窗或加一道低屏。", "c07.hint": "每次計算", "c07.src": "2D 平面視線分析；窗戶視為邊界（看得到戶外但不計入面積）。", "c08.title": "空間序列", "c08.short": "序列", "c08.h2": "先收後放的入口序列", "c08.lede": "以人眼高度 150 cm 從入口走到餐廳。下方三條曲線同步顯示沿路的<b>寬窄</b>（左右淨距）、<b>高低</b>（天花高度）與<b>明暗</b>（看得到的窗面積與距離的相對值）。按播放或拖動時間軸。", "c08.lW": "寬窄（m）", "c08.lH": "天花高（m）", "c08.lB": "明暗（相對）", "c08.s.entry": "入口", "c08.s.foyer": "玄關", "c08.s.center": "客廳", "c08.s.window": "窗邊", "c08.s.arch": "拱門", "c08.s.dining": "餐廳", "c08.n1": "節奏", "c08.n1b": "玄關天花 2.8 m、寬約 2 m，轉進客廳後高度跳到 4.7～5.2 m、寬度放大三倍，窗邊最亮；再穿過拱門進入 3.6 m 的餐廳，空間再次收斂——高、寬、亮三條曲線同時起伏，序列很清楚。", "c08.src": "路徑：各停留點之間以 A* 連接（半徑 32 cm），再平滑；相機不穿牆。", "c09.title": "收納量", "c09.short": "收納", "c09.h2": "收納夠不夠", "c09.lede": "每個櫃體的內部容量以半透明方塊顯示（扣除板厚 1.8 cm），顏色越深容量越大。可以調整家庭人數，看每人分到多少。", "c09.item": "項目", "c09.room": "空間", "c09.run": "延長 m", "c09.people": "家庭人數", "c09.pers": " 人", "c09.total": "總收納量", "c09.perP": "每人收納量", "c09.ratio": "收納率（櫃體投影 ÷ 樓地板）", "c09.n1": "收納率", "c09.n1ok": "收納率 {r}% 落在參考範圍內。", "c09.n1low": "收納率只有 {r}%，低於住宅常見的 10～15% 參考值；客廳幾乎只有展示型收納。", "c09.n2": "建議", "c09.n2b": "影音牆兩側可延伸成到頂高櫃，或把玄關屏風做成雙面櫃，約可再增加 2～3 m³。", "c09.lVol": "內部容量", "c09.small": "小", "c09.large": "大", "c09.src": "參考值為示意（日本住宅規劃常以樓地板 10～15% 作為收納率參考）；你若有慣用標準可替換。", "c10.title": "日照循環", "c10.short": "日照", "c10.h2": "西窗的午後陽光", "c10.lede": "依台中的經緯度與日期計算太陽方位角與高度角（NOAA 公式），陽光經拱窗灑進室內，地上與牆上的光斑即時變化；熱力圖是當天地板累計直射時數。", "c10.summer": "夏至", "c10.equinox": "春秋分", "c10.winter": "冬至", "c10.vAxo": "鳥瞰", "c10.vEye": "室內視角", "c10.heat": "顯示日照時數熱力圖", "c10.az": "方位角", "c10.el": "高度角", "c10.dep": "光斑深入（距西牆）", "c10.lHeat": "地板直射時數", "c10.n1": "西曬", "c10.n1b": "冬至下午太陽偏南又低，光斑一路照到沙發與抽象畫；夏至傍晚太陽偏北，光斑落在拱門與展示櫃一側。", "c10.n2": "策略", "c10.n2b": "西窗外設可調式外遮陽或加深窗框；拋光大理石會反射眩光，地坪可考慮霧面材質。", "c10.src": "太陽位置：NOAA Solar Calculator 公式；地點台中 24.15°N、120.67°E、UTC+8；光斑只計直射、不含反射。", "c11.title": "自然通風", "c11.short": "通風", "c11.h2": "風從哪扇窗進、哪扇窗出", "c11.lede": "在平面上以格子波茲曼法（LBM）跑 1.1 m 高的示意級氣流。選風向或台中季節風，再開關每一扇窗；白色流線是氣流，底色是風速（相對於戶外）。", "c11.winter": "冬季", "c11.winterD": "北風（8 月下旬～5 月）", "c11.summer": "夏季", "c11.summerD": "南風（約 3 個月）", "c11.dir": "風向（風從哪裡來）", "c11.openings": "開窗", "c11.allOpen": "全開", "c11.allClose": "全關", "c11.fMean": "客廳平均風速", "c11.fFrac": "有感氣流面積（> 20%）", "c11.fDin": "餐廳平均風速", "c11.lSpeed": "風速（戶外 = 1）", "c11.lOut": "戶外", "c11.lParticles": "流線", "c11.n1": "穿堂風", "c11.n1b": "西風時左右兩側拱窗對開，氣流橫穿會客區；只開單側時氣流在窗邊打轉、進不到沙發。", "c11.n2": "南風進不來", "c11.n2b": "前牆（南側）沒有開口，夏季南風時客廳幾乎沒有風；可在影音牆上方加高窗或通風百葉。", "c11.src": "D2Q9 格子波茲曼法、BGK 碰撞、牆面反彈邊界；示意級，非 CFD 認證。", "c12.title": "冷氣與溫度", "c12.short": "溫度", "c12.h2": "冷氣裝哪裡比較涼", "c12.lede": "關窗開冷氣，比較兩種安裝位置：<b>方案 A</b> 藏在白色造型天花邊緣的線型出風口、朝西窗吹；<b>方案 B</b> 右牆壁掛式。考慮夏季下午西曬、4 人與電視的熱。", "c12.both": "並排比較", "c12.A": "方案 A", "c12.B": "方案 B", "c12.acOn": "冷氣開", "c12.sun": "夏季 16:00 西曬", "c12.people": "人與電視的熱", "c12.mean": "會客區平均", "c12.comfort": "舒適面積", "c12.west": "西窗邊最高", "c12.computing": "計算溫度分布中…", "c12.res": "比較結果", "c12.resB": "方案 {k} 的會客區舒適面積較大（24–27 °C）。", "c12.n1": "西曬熱區", "c12.n1b": "下午陽光把西窗前的地板曬熱，壁掛式冷氣的冷風很難吹到房間另一頭，窗邊閱讀角最熱。", "c12.lT": "室內溫度", "c12.src": "沿用通風流場，再加上溫度的對流與擴散（被動純量）；出風 16 °C、戶外 33 °C；示意級。", "c13.title": "聲環境", "c13.short": "聲環境", "c13.h2": "閱讀角夠安靜嗎", "c13.lede": "噪音源：入口外的車道與馬路、廚房抽油煙機、庭院泳池幫浦。距離每加倍降 6 dB，每穿過一道牆扣 40 dB、門 20 dB、關窗 25 dB、開窗 5 dB。窗邊閱讀角的門檻是 40 dB。", "c13.closed": "窗戶關", "c13.open": "窗戶開", "c13.sources": "噪音源", "c13.quiet": "閱讀角", "c13.fMean": "閱讀角平均", "c13.fMax": "閱讀角最高", "c13.fLimit": "門檻 40 dB", "c13.over": "超過", "c13.under": "符合", "c13.lDb": "噪音等級", "c13.lQuiet": "安靜需求區", "c13.n1": "開窗", "c13.n1b": "開窗時泳池幫浦與車道的聲音直接進來，閱讀角超過 40 dB；關窗時大多能壓到門檻以下。", "c13.n2": "策略", "c13.n2b": "入口側用雙層玻璃；閱讀角加厚窗簾與地毯；幫浦加隔音箱或移到建物另一側。", "c13.src": "示意級：點聲源幾何衰減＋穿透損失，不含反射與殘響。", "c14.title": "色彩計畫", "c14.short": "色彩", "c14.h2": "從照片抽色，再看 60-30-10", "c14.lede": "上排是從原圖用 k-means（Lab 色彩空間）抽出的 7 色；下排是 3D 模型依實際表面積加權的配色，可對照 60-30-10 原則（主色 60%、輔色 30%、點綴 10%）。點色票會在 3D 中只留那個部位的顏色，並複製色碼。", "c14.photoPal": "原圖色票", "c14.modelPal": "模型配色（面積加權）", "c14.live": "瀏覽器即時萃取 {ms} ms", "c14.main": "主色", "c14.second": "輔色", "c14.accent": "點綴", "c14.rule": "60-30-10 原則", "c14.n1": "讀法", "c14.n1b": "撞色風格的大面積是鈷藍牆與天花、米色大理石；紅、黃只出現在沙發、單椅、地毯與畫——面積小但彩度最高，正好是 10% 的點綴。", "c14.hint": "切換下方風格，配色同步更新。", "c15.title": "材質與風格", "c15.short": "風格", "c15.h2": "一鍵換裝，再逐項微調", "c15.lede": "四種風格預設：原圖的撞色曲線，加上侘寂、北歐、工業風。點卡片整個空間換裝（材質＋家具款式＋牆上的畫），再用下面八個材質槽逐項調整。", "c15.slots": "材質槽", "c15.reset": "重設為風格預設", "c15.swap": "換材質反應時間", "c15.n1": "提案用法", "c15.n1b": "跟業主討論時，先選最接近的風格，再只改他們在意的一兩個部位（例如地坪、沙發布），比從零開始選材快很多。", "c15.src": "材質以 PBR（顏色、粗糙度、金屬度）定義，紋理由程式產生（L1）。", "c16.title": "軟裝配置", "c16.short": "軟裝", "c16.h2": "點家具，換款式", "c16.lede": "滑鼠移到可替換的家具會出現紅框，點一下跳出替代款，選了就原位替換（位置與朝向不變）。換完會重算動線總長與收納量。", "c16.last": "剛剛替換", "c16.changed": "{n} → {v}：動線總長 {r} m（{dr}）、收納 {s} m³（{ds}）。", "c16.hint": "手機：點家具開啟選單；也可以點右邊的清單。", "c16.v.sofa-curve": "曲線絨布沙發", "c16.v.sofa-modular": "模組沙發", "c16.v.chair-pumpkin": "南瓜單椅", "c16.v.chair-lounge": "木框躺椅", "c16.v.table-blob": "有機鏡面茶几", "c16.v.table-drum": "石材圓鼓茶几", "c16.v.rug-swirl": "撞色漩渦地毯", "c16.v.rug-plain": "素色圓角地毯", "c16.v.sideboard-fluted": "溝紋矮櫃", "c16.v.sideboard-plain": "平板矮櫃", "c16.v.lamp-arc": "弧形落地燈", "c16.v.lamp-tripod": "三腳落地燈", "c16.v.side-stack": "疊圓邊几", "c16.v.side-drum": "圓筒邊几", "c16.v.dining-round": "圓餐桌", "c16.v.dining-oval": "橢圓木餐桌", "c16.v.dchair-up": "絨布餐椅", "c16.v.dchair-wood": "木餐椅", "c16.v.pendant-globe": "球形吊燈", "c16.v.pendant-cone": "錐形吊燈", "c17.title": "總結", "c17.short": "總結", "c17.h2": "發現與設計策略", "c17.lede": "每張卡片是一章的分析發現與對應的設計策略，數字由本站即時計算；點卡片回到該章。左邊是推薦組合：撞色曲線為主，地坪改霧面微水泥（降低西曬眩光），單椅改成面向窗的躺椅（閱讀角更有隱私）。", "c17.rec": "顯示推薦組合", "c17.hint": "離開本章會還原你原本選的風格與家具。", "c17.photo.f": "照片可見 {a}/{b} 件家具、{c}/{d} 個門窗開口，其餘由推測補齊。", "c17.photo.s": "先請業主確認入口、廚房與影音牆的位置，再深化設計。", "c17.scale.f": "客廳 {a} m²、挑高 5.2 m，尺度接近公共空間。", "c17.scale.s": "用造型天花、地毯與家具組群界定區塊，避免空曠。", "c17.zone.f": "窗邊閱讀角是唯一靜區，卻緊鄰會客區與往餐廳的動線。", "c17.zone.s": "單椅轉向窗、加低屏或厚窗簾，讓閱讀角真正安靜。", "c17.route.f": "家事動線 {a} m（起居 {b} m），兩者在玄關出口與沙發右側重疊。", "c17.route.s": "把廚房門移到玄關側，家事動線約可縮短一半並避開會客區。", "c17.iso.f": "玄關的可視面積 {a} m²，隱私指數 {b}%。", "c17.iso.s": "保留曲面屏風，維持進門時「先收後放」的視線。", "c17.seq.f": "天花 2.8 → 5.2 → 3.6 m，寬度與明暗同步收放。", "c17.seq.s": "保留這個序列；玄關燈光可再壓低色溫，加強轉折感。", "c17.store.f": "總收納 {a} m³，收納率 {b}%。", "c17.store.s": "影音牆兩側做到頂高櫃，屏風改雙面櫃。", "c17.sun.f": "西窗光斑：冬至 16:00 深入 {a} m、夏至 17:00 深入 {b} m。", "c17.sun.s": "西窗外加可調外遮陽，地坪改霧面降低眩光。", "c17.wind.f": "全開窗時客廳平均風速：西風 {a}%、南風 {b}%（戶外 = 100%）。", "c17.wind.s": "南側影音牆上方加高窗或通風百葉，讓夏季南風進來。", "c17.therm.f": "會客區舒適面積：方案 A {a}%、方案 B {b}%。", "c17.therm.s": "採用天花線型出風、朝西窗吹，抵銷下午西曬。", "c17.therm0.f": "冷氣兩種位置的比較在第 12 章計算。", "c17.therm0.s": "到第 12 章跑完後，這裡會顯示結果。", "c17.noise.f": "開窗時閱讀角平均 {a} dB，門檻 {b} dB。", "c17.noise.s": "入口側雙層玻璃，閱讀角加厚窗簾與地毯。", "c17.color.f": "大面積藍與白、紅黃只在家具與畫上，接近 60-30-10。", "c17.color.s": "維持這個比例；換風格時優先換點綴色而不是主色。", "c17.style.f": "四種風格可一鍵換裝，換材質不到 0.5 秒。", "c17.style.s": "推薦：撞色曲線＋霧面微水泥地坪＋面窗躺椅（左圖）。"}, "en": {"site.title": "Interior Analysis | Colour-Block Curve Living Room", "site.name": "Interior analysis", "site.case": "Colour-Block Curve Living", "ui.index": "Chapters", "ui.indexTitle": "Chapters", "ui.schematic": "Schematic analysis", "ui.caseError": "Case data has errors – see the console", "ui.copied": "Copied {v}", "ui.computing": "Computing…", "ui.m2": "m²", "ui.ping": "ping", "ui.on": "On", "ui.off": "Off", "ui.reset": "Reset", "ui.play": "Play", "ui.pause": "Pause", "ui.inferred": "Inferred (not in the photo)", "ui.visible": "Seen in the photo", "ui.source": "Data & method", "grp.open": "Opening", "grp.draw": "Drawings", "grp.space": "Spatial organisation", "grp.env": "Environment", "grp.prop": "Style & proposal", "c00.title": "Cover", "c00.kicker": "Interior analysis | Case 01", "c00.h1": "Colour-block curve living room", "c00.lede": "From <b>one interior photo</b> we infer the walls and rooms the camera never saw, rebuild the space in 3D, analyse it across 17 chapters – scale, circulation, light, air, heat, sound and style – and end with design strategies.", "c00.photo": "Source photo", "c00.render": "3D rebuild from the photo's viewpoint (photo not published)", "c00.area": "Inferred total area", "c00.height": "Living ceiling (double height)", "c00.rooms": "Spaces", "c00.chapters": "Chapters", "c00.hint": "Use ← →, the side arrows or the chapter rail; drag to orbit, scroll to zoom, right-drag to pan.", "c00.defaults": "Unanswered questions use defaults:", "c01.title": "Photo vs. inference", "c01.short": "Photo", "c01.h2": "What the photo shows, what we inferred", "c01.lede": "The photo only covers the back-left corner of the living room. Fitting the camera to 11 features (painting, arch, sideboard, arched window) gives a standing eye height of about 160 cm with an ultra-wide lens; the rest of the walls, openings and rooms were inferred from architectural logic. <b>Blue hatching</b> marks everything the photo cannot see.", "c01.view": "Photo view", "c01.free": "Orbit", "c01.overlay": "Photo overlay", "c01.hatch": "Mark inferred zone", "c01.split": "Side by side", "c01.fFurn": "Furniture seen in photo", "c01.fOpen": "Openings seen in photo", "c01.fFit": "Camera fit, mean error", "c01.fRooms": "Spaces inferred", "c01.n1": "Seen", "c01.n1b": "Rear arched window, white curved fin and pedestal, arch, walnut niche, painting and fluted sideboard, curved sofa, armchair, coffee table, rug, arc lamp, oval timber coffer.", "c01.n2": "Inferred", "c01.n2b": "Main entry with shoe cabinet and curved screen, arched media wall behind the camera, a second west and a mirrored east arched window, kitchen door and kitchen, dining and kitchen windows.", "c01.n3": "Perspective mismatch", "c01.n3b": "The dining room in the photo does not share the living room's perspective (common in AI-generated images); the 3D keeps it architecturally straight and the overlay is matched on the living room.", "c01.nophoto": "The public version omits the source photo (unknown origin); the local version supports the overlay.", "c01.src": "Camera: pinhole, zero pitch (two-point perspective), ~100° vertical FOV, principal point offset 47 px; inference rules R-1–R-6 per SDD §4.4.", "c02.title": "Overview (3.5D)", "c02.short": "Overview", "c02.h2": "A 5.2 m high living room of curves", "c02.lede": "You enter at the front-right foyer under a 2.8 m ceiling, turn past a white curved screen and the space opens to the 5.2 m living room; a 4 m arch leads to the 3.6 m dining room and a rear door to the kitchen. The axonometric has no perspective distortion and walls facing you hide automatically.", "c02.axo": "Axonometric", "c02.persp": "Perspective", "c02.cut": "Cut at 1.4 m", "c02.full": "Full height", "c02.views": "Preset views", "c02.fTotal": "Total floor area (net)", "c02.fLiving": "Living (incl. foyer)", "c02.fDining": "Dining", "c02.fKitchen": "Kitchen (inferred)", "c02.hint": "Drag to orbit, scroll to zoom, right-drag (or Shift-drag) to pan; on phones one finger orbits, two fingers zoom.", "c03.title": "Plans & elevations", "c03.short": "Drawings", "c03.h2": "Plan and four elevations", "c03.lede": "Drawn live from the same case data (case.json): black walls are seen in the photo, blue hatching is inferred. Elevations A–D run clockwise from the entry; click the A–D markers on the plan to switch.", "c03.plan": "Plan", "c03.dims": "Dimensions", "c03.dTotal": "Overall", "c03.dOpen": "Openings", "c03.dFurn": "Furniture", "c03.lWall": "Walls & furniture seen in the photo", "c03.lInf": "Inferred (not in the photo)", "c03.lSoffit": "Dashed = feature ceiling & timber coffer", "c03.hint": "Units cm, net interior dimensions; 1 ping = 3.3058 m².", "c04.title": "Exploded view", "c04.short": "Exploded", "c04.h2": "Six layers, bottom to top", "c04.lede": "Lifted apart in construction order: floor → walls & openings → built-ins → loose furniture → lighting → ceiling. Drag the slider to explode; click a layer to isolate it.", "c04.slider": "Explode", "c04.layers": "Layers", "c04.floor": "Floor", "c04.floorD": "Polished marble, rug", "c04.walls": "Walls & openings", "c04.wallsD": "Cobalt plaster, white curved fin, arched windows, arch, art", "c04.builtin": "Built-ins", "c04.builtinD": "Walnut niche, media console, shoe cabinet, kitchen", "c04.loose": "Loose furniture", "c04.looseD": "Curved sofa, armchair, tables, dining set", "c04.lights": "Lighting", "c04.lightsD": "Downlights, floor, table and pendant lamps", "c04.ceiling": "Ceiling", "c04.ceilingD": "Blue plaster ceiling, white feature soffit, oval timber coffer, dining cove", "c04.hint": "Click the same layer again to show all.", "c05.title": "Zoning", "c05.short": "Zoning", "c05.h2": "Four zones inside one big room", "c05.lede": "The living room is one open space, so it is zoned by areas – foyer, lounge, media corner, window nook – plus the dining room and kitchen. Plan colours on the left, bubble diagram on the right: circle size follows area, solid links are doors or arches, dashed links are open connections.", "c05.s.privacy": "Public / private", "c05.s.wet": "Wet / dry", "c05.s.activity": "Active / quiet", "c05.k.public": "Public", "c05.k.semi": "Semi-public", "c05.k.service": "Service", "c05.k.transit": "Transition", "c05.k.dry": "Dry", "c05.k.wet": "Wet", "c05.k.active": "Active", "c05.k.quiet": "Quiet", "c05.n.privacy": "The foyer is the transition, the living room fully public, dining semi-public, kitchen service; nothing is private, so guests see everything from the door.", "c05.n.wet": "Only the kitchen is wet, plumbed along the rear wall and separated from the living room by a door, so steam and cooking smells stay out of the lounge.", "c05.n.activity": "The window nook is the only quiet zone yet sits next to the lounge and the route to dining; it needs soft absorption (rug, curtains) or re-oriented seating.", "c05.fZones": "Zones in the living room", "c05.fWet": "Wet zone (kitchen)", "c05.fQuiet": "Quiet zone area", "c05.fDoors": "Doors / arches to the living room", "c05.bubble": "Bubble diagram", "c05.bubbleNote": "Solid = door or arch · dashed = open · blue outline = inferred", "c05.via.door": "door", "c05.via.arch": "arch", "c05.out": "Outside / entry", "c05.hint": "A single room is zoned by areas rather than rooms (SDD FR-05).", "ui.simMissing": "Analysis modules are not loaded.", "c06.title": "Circulation", "c06.short": "Routes", "c06.h2": "Where the three routes meet", "c06.lede": "The plan is cut into a 10 cm grid with walls and furniture as obstacles (25 cm body radius) and A* finds the shortest paths: <b>daily</b> (entry → sofa), <b>chore</b> (entry → kitchen) and <b>guest</b> (entry → sofa → dining). Overlaps are hot spots; routes are recomputed when furniture changes.", "c06.daily": "Daily", "c06.chore": "Chore", "c06.guest": "Guest", "c06.hot": "Hot spot", "c06.nEntry": "Entry", "c06.nSofa": "Sofa", "c06.nKitchen": "Kitchen", "c06.nDining": "Dining", "c06.fClear": "Main passage clear width (R-3)", "c06.n1": "Foyer exit", "c06.n1b": "All three routes enter the living room past the north end of the screen – the busiest point in the house; pulling the screen 30 cm south would ease it.", "c06.n2": "Chore route", "c06.n2b": "Carrying shopping to the kitchen means walking along the right wall to the back corner, sharing the aisle beside the sofa; a kitchen door next to the foyer would halve the route and keep it out of the lounge.", "c06.src": "A*: 8-connected grid, octile heuristic; paths simplified by line of sight.", "c07.title": "Isovist", "c07.short": "Isovist", "c07.h2": "How much you see from here", "c07.lede": "360 sight lines leave the observer; walls, closed doors and furniture taller than 150 cm block them, giving the visible area (isovist). <b>Drag the red dot</b> or pick a preset; values update live. Privacy index = 1 − visible area ÷ total floor area.", "c07.p.entry": "Foyer", "c07.p.sofa": "Sofa", "c07.p.chair": "Armchair", "c07.p.dining": "Dining", "c07.fArea": "Visible area", "c07.fPriv": "Privacy index", "c07.fQuiet": "Window nook in view", "c07.lVis": "Visible area", "c07.lQuiet": "Window nook (quiet zone)", "c07.lObs": "Observer", "c07.n1": "Foyer", "c07.n1b": "The curved screen // Adapter between the chapters and the simulation modules (IA.plan2d / IA.sim): cached plan, grid drawing helpers,

      IA.V.onPointerUp = (ev, click) => { if (!click) return; const h = IA.V.pick(ev); const fid = h && h.object.userData.fid, f = fid && IA.byId[fid]; if (f && f.swappable) openPop(f, ev); else U.$("#pop").classList.remove("on"); };
    },
    leave() { showBox(null); U.$("#pop").classList.remove("on"); },
    onLang() { }
  });
})(window);

/* ---- chapters/c17-summary.js ---- */
// FR-17 總結: one "finding → design strategy" card per analysis, written from the numbers this site computes (quick ones
// on entry, the two airflow cases in the background); click a card to jump back; the recommended combination in 3D.
(function (G) {
  const IA = G.IA, U = IA.U, S = IA.S, C = IA.case, X = () => IA.simx;
  const st = { R: null, wind: null, busy: false, saved: null, rec: true };
  let stop = null;
  const REC = { style: "original", mats: { floor: "microcement" }, variants: { F2: "chair-lounge" } };
  const quick = () => {
    const R = {}, plan = X().plan();
    R.furn = [C.furnishings.filter((f) => !f.inferred && f.category !== "niche").length, C.furnishings.filter((f) => f.category !== "niche").length];
    R.open = [C.openings.filter((o) => !o.inferred).length, C.openings.length];
    R.area = Math.abs(U.area(IA.byId.R1.polygon)) / 1e4;
    try { const r = IA.sim.routes(C, plan, { cell: 10, radius: 25 }); R.routes = {}; r.routes.forEach((q) => { R.routes[q.type] = q.length / 100; }); } catch (e) { }
    try { const iv = IA.sim.isovist(plan, X().nodePos("entry"), { rays: 360, blockH: 150 }); R.entry = iv; } catch (e) { }
    try { const s = IA.sim.storage(C, IA.state, { board: 1.8 }); R.store = s; } catch (e) { }
    try {
      const L = C.meta.location, dep = (m, d, h) => { const p = IA.sim.sunPos(2026, m, d, h, 0, L.lat, L.lng, L.tz); if (p.el <= 0) return 0; const D = IA.sim.sunDepth(IA.sim.sunPatches(C, plan, p.az, p.el) || []); return (D.byWall && D.byWall.W1 != null ? D.byWall.W1 : D.max) / 100; };
      R.sunW = dep(12, 21, 16); R.sunS = dep(6, 21, 17);
    } catch (e) { }
    try { const open = {}; C.openings.filter((o) => o.type === "window").forEach((o) => { open[o.id] = true; }); const p2 = X().plan({ open: Object.assign({}, IA.state.open, open) }); const g = IA.sim.rasterize(p2, { cell: 15, margin: 300, purpose: "walk" }); R.noise = IA.sim.noiseMap(C, p2, g, { windowsOpen: true }).stats.A4; } catch (e) { }
    R.thermal = (IA.results || {}).thermal || null;
    return R;
  };
  // two standard airflow cases, computed in the background
  const windCases = () => {
    const open = {}; C.openings.filter((o) => (o.type === "window" && o.operable)).forEach((o) => { open[o.id] = true; });
    const mk = (dir) => { const plan = X().plan({ open: Object.assign({}, IA.state.open, open) }); const g = IA.sim.rasterize(plan, { cell: 14, margin: 500, purpose: "air" }); const l = new IA.sim.LBM(g, { tau: 0.6, u0: 0.05, northAngle: C.meta.northAngle || 0 }); l.setWind(dir, 1); return { dir, l, n: 0 }; };
    return [mk(270), mk(180)];
  };
  const tick = () => {
    if (!st.busy) return false;
    const t0 = performance.now();
    while (performance.now() - t0 < 10) { st.wind.forEach((c) => { if (c.n < 1500) { c.l.step(4); c.n += 4; } }); if (st.wind.every((c) => c.n >= 1500)) break; }
    if (st.wind.every((c) => c.n >= 1500)) { st.busy = false; st.R.wind = st.wind.map((c) => c.l.stats(IA.byId.R1.polygon).mean); if (IA.current().id === "summary") IA.renderPanel(); }
    return false;
  };
  const card = (ch, k, vars) => `<button class="card" type="button" data-go="${ch}"><span class="k">${IA.chapterNo(ch)} · ${S(IA.chapters.find((c) => c.id === ch).short || IA.chapters.find((c) => c.id === ch).title)}</span><span class="f">${S("c17." + k + ".f", vars)}</span><span class="s">${S("c17." + k + ".s", vars)}</span></button>`;
  const applyRec = (on) => {
    if (on) { st.saved = { style: IA.state.style, mats: Object.assign({}, IA.state.mats), variants: Object.assign({}, IA.state.variants) }; IA.applyStyle(REC.style); Object.entries(REC.mats).forEach(([k, v]) => IA.setMat(k, v)); Object.entries(REC.variants).forEach(([k, v]) => IA.setVariant(k, v)); }
    else if (st.saved) { IA.state.mats = st.saved.mats; IA.state.style = st.saved.style; IA.emit("materials"); Object.entries(st.saved.variants).forEach(([k, v]) => { if (IA.state.variants[k] !== v) IA.setVariant(k, v); }); st.saved = null; }
  };
  IA.chapter({
    id: "summary", group: "prop", title: "c17.title", short: "c17.short",
    panel() {
      if (!X().ok()) return `<h2>${S("c17.h2")}</h2>` + X().missing();
      const R = st.R || (st.R = quick()), f = (v, d = 1) => U.fmt(v, d);
      const th = R.thermal, wind = R.wind;
      return `<h2>${S("c17.h2")}</h2><p class="lede">${S("c17.lede")}</p>
        ${IA.ui.tog("rec", S("c17.rec"), st.rec)}
        <div class="cards">
          ${card("photo", "photo", { a: R.furn[0], b: R.furn[1], c: R.open[0], d: R.open[1] })}
          ${card("axo", "scale", { a: f(R.area) })}
          ${card("zoning", "zone", {})}
          ${R.routes ? card("circulation", "route", { a: f(R.routes.chore), b: f(R.routes.daily) }) : ""}
          ${R.entry ? card("isovist", "iso", { a: f(R.entry.area_m2), b: f(R.entry.privacy * 100, 0) }) : ""}
          ${card("sequence", "seq", {})}
          ${R.store ? card("storage", "store", { a: f(R.store.total_m3, 2), b: f(R.store.ratio * 100) }) : ""}
          ${R.sunW != null ? card("sun", "sun", { a: f(R.sunW), b: f(R.sunS) }) : ""}
          ${card("wind", "wind", { a: wind ? f(wind[0] * 100, 0) : "…", b: wind ? f(wind[1] * 100, 0) : "…" })}
          ${card("thermal", th ? "therm" : "therm0", th ? { a: f(th[0].comfort * 100, 0), b: f(th[1].comfort * 100, 0) } : {})}
          ${R.noise ? card("acoustic", "noise", { a: f(R.noise.mean, 0), b: R.noise.limit || 40 }) : ""}
          ${card("color", "color", {})}
          ${card("style", "style", {})}
        </div>
        <p class="hint">${S("c17.hint")}</p>`;
    },
    bind(p) {
      U.$$("[data-go]", p).forEach((b) => b.addEventListener("click", () => IA.go(b.dataset.go)));
      const t = U.$("[data-t=rec]", p); if (t) t.addEventListener("change", () => { st.rec = t.checked; applyRec(st.rec); });
    },
    enter() {
      if (!X().ok()) return;
      U.$("#photoL").src = IA.photo || "";
      IA.V.setPhotoLayout({ split: !!IA.photo, overlay: 0 }); IA.V.view({ mode: "photo" }); IA.V.ctl.lock = true; IA.V.scene.background = new THREE.Color("#DCE7EC");
      st.R = null; if (st.rec) applyRec(true);
      IA.renderPanel();
      if (!st.R.wind) { st.wind = windCases(); st.busy = true; stop = IA.V.loop(tick); }
    },
    leave() { if (stop) stop(); stop = null; st.busy = false; IA.V.ctl.lock = false; if (st.rec) applyRec(false); },
    onLang() { }
  });
})(window);

/* ---- core/boot.js ---- */
// Boot: validate the case (§5 R-1…R-6 light checks), build the scene, start the router.
(function (G) {
  const IA = G.IA, U = IA.U, C = IA.case;
  const errs = [];
  ["meta", "source", "rooms", "walls", "openings", "furnishings", "materialSlots", "styles"].forEach((k) => { if (!C[k]) errs.push("missing " + k); });
  if (!C.openings.some((o) => o.type === "door" && o.entry)) errs.push("R-1: no entry door");
  C.openings.filter((o) => o.type === "window").forEach((o) => { const w = IA.byId[o.wall]; if (!w || !w.exterior) errs.push("R-1: window " + o.id + " not on an exterior wall"); });
  C.furnishings.concat(C.openings, C.elements).forEach((o) => { if (o.inferred == null) errs.push("R-6: " + o.id + " lacks inferred flag"); });
  if (errs.length) { console.error("case.json:", errs); }
  IA.caseErrors = errs;
  const boot = () => {
    if (!G.THREE) { document.body.insertAdjacentHTML("beforeend", "<p style='position:fixed;inset:auto 0 40% 0;text-align:center;font:15px sans-serif'>three.js 載入失敗，請確認網路連線 / three.js failed to load (check the connection).</p>"); return; }
    try { IA.V.init(); } catch (e) { console.error(e); document.body.insertAdjacentHTML("beforeend", "<p style='position:fixed;inset:auto 0 40% 0;text-align:center;font:15px sans-serif'>此瀏覽器無法啟動 WebGL / WebGL is not available.</p>"); return; }
    if (errs.length) U.toast(IA.S("ui.caseError"), 5000);
    IA.start();
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})(window);

</script>
